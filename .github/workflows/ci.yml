name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit + integration + adversarial + e2e tests
        working-directory: backend
        run: python -m pytest tests -q

  acceptance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      # Re-runs the exact measurements quoted in the README and fails the build
      # if any acceptance target regresses (permission fixtures, detection
      # recall, baseline FP rate, dedup replay, authz matrix, traceability).
      - name: Acceptance evaluation (writes benchmarks/results/evaluation.json)
        run: python benchmarks/evaluation.py

      - name: Ingestion load benchmark (10k + 100k)
        run: python benchmarks/load_test.py

      - name: Upload measured results
        uses: actions/upload-artifact@v4
        with:
          name: measured-results
          path: benchmarks/results/*.json
